services:
  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - WORKSPACE_DRIVER=docker
      - WORKSPACE_DOCKER_NETWORK=halley_halley-net
      - CONTROL_PLANE_INTERNAL_URL=http://control-plane:3000
    volumes:
      - halley-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - halley-net
    restart: unless-stopped

volumes:
  halley-data:

networks:
  halley-net:
    driver: bridge
