name: Docker Hub Build (PR)

on:
  pull_request:
    branches: [main]

jobs:
  docker-build-only:
    name: Build Docker Images (${{ matrix.image.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: halley-control-plane
            dockerfile: docker/control-plane.Dockerfile
          - name: halley-workspace
            dockerfile: docker/workspace.Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: halley/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
