name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck, Unit & E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

      - name: Install Playwright Chromium for E2E
        run: pnpm --filter @halley/workspace-runner exec playwright install chromium --with-deps

      - name: Run E2E tests (with fakes)
        run: pnpm test:e2e
